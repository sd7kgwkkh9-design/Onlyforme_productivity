<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>나의 캘린더</title>
  {% include "_head.html" %}
</head>
<body data-view="month" data-login="{{ '1' if login_enabled else '0' }}">
  {% if demo %}
  <p class="demo-banner" role="note">
    <strong>시연용 캘린더</strong>예요. 예시 일정이며 실제 데이터와 분리되어 있고, 앱을 다시 실행하면 처음 상태로 돌아가요.
  </p>
  {% endif %}
  <header class="topbar">
    <div class="nav">
      <button class="icon-btn" id="btn-prev" type="button" aria-label="이전 달">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <h1 class="month-title">
        <!-- 누르면 원하는 달(월간) 또는 날짜가 속한 주(주간)로 바로 이동 -->
        <button class="title-btn" id="month-title" type="button" popovertarget="jump-menu"
                aria-haspopup="dialog" aria-expanded="false" aria-live="polite"></button>
      </h1>
      <button class="icon-btn" id="btn-next" type="button" aria-label="다음 달">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button class="text-btn" id="btn-today" type="button">오늘</button>
      <!-- 주간 화면에서만 보임: 가로(7칸 나란히) ⇄ 세로(위에서 아래로) -->
      <button class="icon-btn layout-btn" id="btn-week-layout" type="button"></button>
    </div>
    <div class="actions">
      <div class="seg view-switch" role="group" aria-label="보기">
        <button class="seg-btn" id="btn-view-month" type="button" aria-pressed="true">월간</button>
        <button class="seg-btn" id="btn-view-week" type="button" aria-pressed="false">이번 주</button>
      </div>
      <button class="text-btn" id="btn-undated" type="button">
        기한 미정 <span class="count" id="undated-count" hidden>0</span>
      </button>
      <button class="text-btn" id="btn-categories" type="button">카테고리</button>
      <button class="icon-btn theme-btn" id="btn-theme" type="button" popovertarget="theme-menu"
              aria-haspopup="true" aria-expanded="false" aria-label="화면 테마"></button>
    </div>
  </header>

  <!-- 화면 테마 메뉴 (popover: 바깥을 누르거나 Esc를 누르면 저절로 닫힌다) -->
  <div class="theme-menu" id="theme-menu" popover role="menu" aria-label="화면 테마">
    <button type="button" role="menuitemradio" data-theme-choice="auto">시스템 설정 따라가기</button>
    <button type="button" role="menuitemradio" data-theme-choice="light">라이트</button>
    <button type="button" role="menuitemradio" data-theme-choice="dark">다크</button>
  </div>

  <!-- 제목을 눌렀을 때 뜨는 빠른 이동 (내용은 jump.js가 그린다) -->
  <div class="jump-menu" id="jump-menu" popover role="dialog" aria-label="날짜로 이동"></div>

  <div class="layout">
    <main class="calendar-wrap" id="calendar-wrap">
      <div id="calendar"></div>
      <section class="week" id="week" aria-label="주간 일정" hidden></section>
    </main>

    <!-- 오른쪽 칸 (넓은 화면에서만 보임)
         [날짜 일정] 고른 날짜의 일정 — 처음엔 오늘. 추가·수정·순서 바꾸기도 여기서
         [기한 미정] 카드를 달력의 날짜로 끌어다 놓으면 그 날짜에 들어감 -->
    <aside class="pane" id="side-pane" aria-label="날짜 일정과 기한 미정">
      <div class="pane-tabs" role="tablist">
        <button class="pane-tab" id="tab-day" type="button" role="tab" aria-selected="true" aria-controls="pane-day">날짜 일정</button>
        <button class="pane-tab" id="tab-undated" type="button" role="tab" aria-selected="false" aria-controls="pane-undated">
          기한 미정 <span class="count" id="tab-undated-count" hidden>0</span>
        </button>
      </div>

      <section class="pane-host" id="pane-day" role="tabpanel" aria-labelledby="tab-day">
        <header class="sheet-head">
          <button class="icon-btn sheet-back" type="button" aria-label="뒤로" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <div class="sheet-heading">
            <h2 class="sheet-title" tabindex="-1"></h2>
            <p class="sheet-sub"></p>
          </div>
        </header>
        <div class="sheet-body"></div>
        <footer class="sheet-foot"></footer>
      </section>

      <section class="pane-undated" id="pane-undated" role="tabpanel" aria-labelledby="tab-undated" hidden>
        <p class="panel-hint">카드를 달력의 날짜로 끌어다 놓으면 그 날짜에 들어가요.</p>
        <ul class="panel-list"></ul>
        <button class="btn wide panel-add" type="button">할 일 추가</button>
      </section>
    </aside>
  </div>

  <!-- 팝업 편집 창: 좁은 화면의 날짜 일정·기한 미정, 그리고 카테고리 관리 -->
  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-inner">
      <header class="sheet-head">
        <button class="icon-btn sheet-back" type="button" aria-label="뒤로" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <div class="sheet-heading">
          <h2 class="sheet-title" id="sheet-title" tabindex="-1"></h2>
          <p class="sheet-sub"></p>
        </div>
        <button class="icon-btn sheet-close" type="button" aria-label="닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="sheet-body"></div>
      <footer class="sheet-foot"></footer>
    </div>
  </dialog>

  <!-- 확인/선택 질문 창 ("이 날만 / 모든 날짜" 등) -->
  <dialog class="ask" id="ask" aria-labelledby="ask-message">
    <p id="ask-message"></p>
    <div class="ask-buttons" id="ask-buttons"></div>
  </dialog>

  <!-- popover: 열려 있는 창(dialog)보다 위에 보이도록 브라우저 최상위 층에 띄운다 -->
  <div class="toast" id="toast" popover="manual" role="status" aria-live="polite"></div>

  <!-- 오픈소스: FullCalendar v6.1.22 (MIT) — static/vendor/fullcalendar/LICENSE.md -->
  <script src="{{ url_for('static', filename='vendor/fullcalendar/fullcalendar.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/fullcalendar/ko.min.js') }}"></script>
  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
